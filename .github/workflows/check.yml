name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # M12-03 (ADR-039): boot every save fixture at desktop and phone size; no page errors, no sideways scroll
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: smoke-shots/
          if-no-files-found: ignore
      # Act I pacing is deterministic and takes seconds: a miss outside ±15% fails the PR
      - run: npm run sim -- --until=first-cavein --strict
